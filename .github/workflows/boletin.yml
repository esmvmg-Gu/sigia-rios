name: Boletín de ríos

on:
  schedule:
    # Hora UTC. Guatemala = UTC-6 → 06:07, 12:07 y 18:07 hora de Guatemala
    - cron: "7 12,18,0 * * *"
  workflow_dispatch:
    inputs:
      estacion:
        description: "Solo una estación (vacío = todas las activas)"
        required: false
        default: ""

jobs:
  boletin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
      WU_API_KEY: ${{ secrets.WU_API_KEY }}
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
      - name: Enviar boletín
        run: Rscript sigia_monitor.R boletin ${{ github.event.inputs.estacion }}
