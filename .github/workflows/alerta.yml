name: Alertas de ríos

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede atrasarlo unos minutos)
  workflow_dispatch:

# Evita que dos revisiones corran a la vez y choquen al guardar el estado
concurrency:
  group: alertas-rios
  cancel-in-progress: false

permissions:
  contents: write   # para guardar estado/ en el repositorio

jobs:
  alerta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANG: C.UTF-8
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
      WU_API_KEY: ${{ secrets.WU_API_KEY }}
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
      - name: Revisar ríos
        run: Rscript sigia_monitor.R alerta
      - name: Guardar estado
        run: |
          if [ -n "$(git status --porcelain estado/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado/
            git commit -m "Estado de alertas actualizado [skip ci]"
            git pull --rebase --quiet
            git push
          fi
